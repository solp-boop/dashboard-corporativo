[theme]
base = "light"
primaryColor = "#2456A6"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2330"
font = "sans serif"
baseRadius = "medium"
borderColor = "#E3E7EC"
showWidgetBorder = true

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[server]
runOnSave = false
headless = true

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
